<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Ide Konten</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 60px auto;
      padding: 20px;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 12px;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 12px;
      resize: none;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 16px;
    }

    #hasil {
      margin-top: 20px;
      padding: 15px;
      background: #f1f1f1;
      border-radius: 12px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="box">

      <h1>🤖 AI Ide Konten</h1>

      <p>
        Masukkan topik yang ingin kamu buat menjadi konten.
      </p>

      <textarea
        id="topik"
        placeholder="Contoh: sepak bola, gaming, cerita horor..."
      ></textarea>

      <button onclick="buatIde()">
        Buat Ide
      </button>

      <div id="hasil">
        Hasil akan muncul di sini.
      </div>

    </div>
  </div>

  <script>
    function buatIde() {
      const topik = document.getElementById("topik").value;

      if (topik.trim() === "") {
        document.getElementById("hasil").innerText =
          "Masukkan topik terlebih dahulu.";
        return;
      }

      document.getElementById("hasil").innerHTML =
        "<b>Ide konten untuk:</b> " + topik +
        "<br><br>" +
        "1. 5 fakta menarik tentang " + topik +
        "<br>" +
        "2. Hal yang jarang diketahui tentang " + topik +
        "<br>" +
        "3. Kesalahan umum tentang " + topik +
        "<br>" +
        "4. 3 hal mengejutkan tentang " + topik +
        "<br>" +
        "5. Cerita menarik tentang " + topik;
    }
  </script>

</body>
</html>
