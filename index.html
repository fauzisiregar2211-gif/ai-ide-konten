<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Ide Konten Saya</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 60px auto;
      padding: 20px;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 12px;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 12px;
      resize: none;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 16px;
    }

    #hasil {
      margin-top: 20px;
      padding: 15px;
      background: #f1f1f1;
      border-radius: 12px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="box">

      <h1>🤖 AI Ide Konten</h1>

      <p>
        Masukkan topik yang ingin kamu buat menjadi konten.
      </p>

      <textarea
        id="topik"
        placeholder="Contoh: sepak bola, gaming, cerita horor..."
      ></textarea>

      <button onclick="buatIde()">
        Buat Ide
      </button>

      <div id="hasil">
        Hasil akan muncul di sini.
      </div>

    </div>
  </div>

  <script>
    async function buatIde() {
  const topik = document.getElementById("topik").value.trim();
  const hasil = document.getElementById("hasil");

  if (!topik) {
    hasil.textContent = "Masukkan topik terlebih dahulu.";
    return;
  }

  hasil.textContent = "⏳ Sedang membuat ide dengan AI...";

  try {
    const response = await fetch(
      "https://ai-ide-konten-api.fauzisiregar2211.workers.dev",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          topik: topik
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      hasil.textContent = "❌ " + (data.error || "Terjadi kesalahan.");
      return;
    }

    hasil.style.whiteSpace = "pre-line";
    hasil.textContent = data.hasil || "AI tidak memberikan hasil.";

  } catch (error) {
    hasil.textContent = "❌ Tidak dapat terhubung ke server AI.";
  }
}
        
  </script>

</body>
</html>
